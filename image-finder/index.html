<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Finder - High Quality Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../" class="back-link">← Back to Home</a>
            <h1>🖼️ Image Finder</h1>
            <p class="subtitle">Find images for your "Would You Rather" videos</p>
        </header>

        <div id="selectedPanel" class="selected-panel hidden">
            <div class="selected-header">
                <h3>Selected Images (<span id="selectedCount">0</span>/2)</h3>
                <div class="selected-actions">
                    <button id="clearSelectionBtn" class="btn-small">Clear All</button>
                    <a href="../video-generator/" id="useInVideoBtn" class="btn-primary-small">
                        Use in Video Generator →
                    </a>
                </div>
            </div>
            <div id="selectedImages" class="selected-images-grid"></div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for images... (e.g., nature, technology, portraits)"
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">
                    <span class="search-icon">🔍</span>
                    Search
                </button>
            </div>
            <div class="api-key-section">
                <input
                    type="text"
                    id="apiKeyInput"
                    placeholder="Enter your Unsplash API Key (optional - uses demo mode)"
                    autocomplete="off"
                >
                <small class="help-text">
                    Get a free API key at <a href="https://unsplash.com/developers" target="_blank">Unsplash Developers</a>
                </small>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching for images...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="results" class="results-info hidden">
            <p><span id="resultsCount">0</span> images found</p>
        </div>

        <div id="imageGrid" class="image-grid"></div>

        <div id="loadMore" class="load-more-container hidden">
            <button id="loadMoreBtn" class="load-more-btn">Load More</button>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="">
            <div class="modal-info">
                <p id="modalDescription"></p>
                <a id="downloadLink" href="" download target="_blank" class="download-btn">
                    Download Image
                </a>
                <a id="photographerLink" href="" target="_blank" class="photographer-link">
                    Photo by <span id="photographerName"></span>
                </a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
